<!doctype html><meta charset="utf-8"><title>BREW — проверка сохранений</title>
<style>body{background:#101913;color:#e9dfc8;font:18px system-ui;margin:40px}h1{color:#d7b77a}pre{white-space:pre-wrap;line-height:1.7}strong{color:#9bd389}</style>
<h1>BREW 7.0.41 — проверка сохранений</h1><pre id="result">Загрузка оригинальной игры…</pre>
<script src="brew-core.js"></script><script src="runtime.js"></script>
<script>
(async()=>{
 const output=document.getElementById('result'),expected=JSON.parse(sessionStorage.getItem('brew-storage-test')||'null');
 const wait=()=>new Promise(r=>setTimeout(r,25));
 while(!Brew.ready){if(Brew.error)throw Error(Brew.error);await wait();}
 const state=()=>JSON.parse(Brew.json());
 const take=s=>({map:s.map_id,x:s.x,y:s.y,angle:s.angle,hp:s.hud.health,weapon:s.hud.weapon,ammo:s.hud.ammo});
 if(!expected){
   const menus=new Set();let story=-100;
   for(let t=0;t<1000;t++){
     Brew.advance(40);const s=state();
     if(s.state===2&&!menus.has(s.menu_id)){
       const row=s.items.find(i=>/^(No|New Game|Normal)$/i.test(i.text.trim())&&!(i.flags&5));
       if(row){menus.add(s.menu_id);Brew.menu(s.menu_id,row.index);}
     }
     if([8,11,13].includes(s.state)&&t-story>=10){Brew.key(0xe037);story=t;}
     if(s.state===7&&t%10===0)Brew.key(0xe035);
     if(s.state===3&&t%10===0)Brew.action(1);
   }
   for(let i=0;i<20;i++)Brew.advance(40);
   const saved=take(state());
   if(state().state!==3||!Brew.save())throw Error('Save was not accepted');
   for(let i=0;i<8;i++)Brew.advance(40);
   if(!await Brew.flush())throw Error('Persistent storage write failed');
   sessionStorage.setItem('brew-storage-test',JSON.stringify(saved));
   output.innerHTML='<strong>PASS — сохранение записано в IndexedDB.</strong>\nПерезагрузите страницу для проверки восстановления.\n'+JSON.stringify(saved,null,2);
 }else{
   let loaded=false;
   for(let t=0;t<500;t++){
     Brew.advance(40);const s=state();
     if(!loaded&&s.state===2){
       if(s.menu_id===20){const row=s.items.find(i=>i.text.trim()==='No');if(row)Brew.menu(s.menu_id,row.index);}
       else {Brew.load();loaded=true;}
     }
     if(loaded&&s.state===11)Brew.key(0xe037);
     if(loaded&&s.state===3){
       const actual=take(s);
       if(JSON.stringify(actual)!==JSON.stringify(expected))throw Error('Restored state differs: '+JSON.stringify(actual));
       output.innerHTML='<strong>PASS — сохранение восстановлено после перезагрузки.</strong>\nУровень, позиция, направление, здоровье, оружие и заряды совпали.\n'+JSON.stringify(actual,null,2);
       return;
     }
   }
   throw Error('Saved level was not resumed');
 }
})().catch(error=>{document.getElementById('result').textContent='FAIL: '+error;console.error(error);});
</script>
