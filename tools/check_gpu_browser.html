<!doctype html><meta charset="utf-8"><title>BREW GPU renderer check</title>
<style>body{background:#111;color:#ddd;font:14px monospace}canvas{image-rendering:pixelated;transform:scaleY(-1);border:1px solid #977d45}pre{white-space:pre-wrap}</style>
<canvas id="frame"></canvas><pre id="result">Checking the actual WebGL lighting shader…</pre>
<script>
(async()=>{
 const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL 2 unavailable');
 const source=await(await fetch('/ui/source/lighting.gdshader')).text();
 const fragment='#version 300 es\nprecision highp float;precision highp int;precision highp sampler2D;in vec2 UV;out vec4 COLOR;uniform sampler2D TEXTURE;\n'+source.replace(/shader_type[^;]*;|render_mode[^;]*;/g,'').replace(/(uniform sampler2D \w+)\s*:[^;]*;/g,'$1;').replace('void fragment()','void main()');
 const vertex='#version 300 es\nprecision highp float;out vec2 UV;void main(){vec2 p=vec2(gl_VertexID==1?3.0:-1.0,gl_VertexID==2?3.0:-1.0);gl_Position=vec4(p,0,1);UV=p*0.5+0.5;}';
 const shader=(kind,source)=>{const s=gl.createShader(kind);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;};
 const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);gl.bindVertexArray(gl.createVertexArray());
 const fixtures=await(await fetch('/build/gpu-check/fixtures.json')).json(),rows=[];
 const textures=['TEXTURE','surface_xy','surface_zna','shadow_field','contact_field'].map((name,i)=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.uniform1i(gl.getUniformLocation(program,name),i);return t;});
 for(const f of fixtures){
  const load=async key=>new Uint8Array(await(await fetch('/build/gpu-check/'+f.id+'-'+key+'.rgba')).arrayBuffer());
  const data=await Promise.all(['colour','xy','zna','shadows','contact','reference'].map(load)),p=f.parameters;
  canvas.width=f.width;canvas.height=f.height;gl.viewport(0,0,f.width,f.height);
  for(let i=0;i<5;i++){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,textures[i]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,i===3?1024:i===4?129:f.width,i===3?384:i===4?387:f.height,0,gl.RGBA,gl.UNSIGNED_BYTE,data[i]);}
  const u=name=>gl.getUniformLocation(program,name);gl.uniform4f(u('camera'),p[4],p[5],p[6],p[3]);gl.uniform2f(u('forward_axis'),p[7],p[8]);gl.uniform3f(u('processing'),p[9],p[10],p[11]);gl.uniform2f(u('raster_size'),f.width,f.height);gl.uniform1i(u('light_count'),p[0]);gl.uniform2f(u('floor_ceiling'),p[12],p[13]);
  for(const [name,offset]of [['source_position',0],['source_colour',4],['source_halo',8]]){const a=[];for(let j=0;j<8;j++)a.push(...p.slice(16+j*12+offset,20+j*12+offset));gl.uniform4fv(u(name+'[0]'),a);}
  for(let i=0;i<10;i++)gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();
  const times=[];for(let frame=0;frame<20;frame++){const start=performance.now();for(let i=0;i<3;i++){gl.activeTexture(gl.TEXTURE0+i);gl.bindTexture(gl.TEXTURE_2D,textures[i]);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,f.width,f.height,gl.RGBA,gl.UNSIGNED_BYTE,data[i]);}gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();times.push(performance.now()-start);}
  const actual=new Uint8Array(f.width*f.height*4);gl.readPixels(0,0,f.width,f.height,gl.RGBA,gl.UNSIGNED_BYTE,actual);let max=0,sum=0,changed=0,overTwo=0;
  for(let i=0;i<actual.length;i++){if(i%4===3)continue;const d=Math.abs(actual[i]-data[5][i]);max=Math.max(max,d);sum+=d*d;changed+=d>0;overTwo+=d>2;}
  const rmse=Math.sqrt(sum/(actual.length*.75)),row={id:f.id,max,rmse,overTwo,uploadAndDrawMs:times.sort((a,b)=>a-b)[10]};rows.push(row);document.querySelector('pre').textContent=JSON.stringify(rows,null,2);
  if(max>2||rmse>.15)throw Error('Shader pixel contract failed '+JSON.stringify(row));
  if(gl.getError()!==gl.NO_ERROR)throw Error('WebGL error');
 }
 const info=gl.getExtension('WEBGL_debug_renderer_info');window.gpuCheck={ok:true,rows,renderer:info?gl.getParameter(info.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};
 document.querySelector('pre').textContent=JSON.stringify(window.gpuCheck,null,2);
})().catch(error=>{window.gpuCheck={ok:false,error:String(error)};document.querySelector('pre').textContent=String(error);});
</script>
