<!-- Based on the official Godot MIT HTML export shell. -->
<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<meta name="description" content="Orcs & Elves II: Remastered — классическая ролевая игра в браузере. Classic / Remastered, клавиатура и сенсорное управление.">
		<meta property="og:title" content="Orcs &amp; Elves II: Remastered">
		<meta property="og:description" content="Orcs &amp; Elves II — игра в браузере с адаптивным управлением.">
		<meta property="og:type" content="website">
		<style>
:root {
	--oe-safe-left: env(safe-area-inset-left, 0px);
	--oe-safe-top: env(safe-area-inset-top, 0px);
	--oe-safe-right: env(safe-area-inset-right, 0px);
	--oe-safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #080e10;
	overflow: hidden;
	touch-action: none;
}

#game-frame {
	position: fixed;
	left: env(safe-area-inset-left, 0px);
	right: env(safe-area-inset-right, 0px);
	top: env(safe-area-inset-top, 0px);
	bottom: env(safe-area-inset-bottom, 0px);
	height: calc(var(--oe-height, 100dvh) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
	background: #080e10;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
<pre id="oe-perf" style="display:none"></pre>
<pre id="oe-perf-view" aria-hidden="true" style="display:none;position:fixed;right:6px;top:0;max-width:190px;white-space:pre-wrap;color:#c9d3ce;background:#101820dd;z-index:99;pointer-events:none;font:10px monospace"></pre>
<script>if(location.search.includes("perf=1"))document.getElementById("oe-perf-view").style.display="block";</script>
		<main id="game-frame">
		<canvas id="canvas">
			Для игры нужен браузер с поддержкой canvas.
		</canvas>

		<noscript>
			Для игры необходимо включить JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div style="font:22px system-ui;letter-spacing:0.25em;color:#d8d7bf;z-index:2">ORCS &amp; ELVES II</div>
<progress id="status-progress" style="accent-color:#bbc69d"></progress>
			<div id="status-notice"></div>
		</div>
		</main>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const frame = document.getElementById('game-frame');
const canvas = document.getElementById('canvas');
function sizePortraitFrame() {
	const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
	document.documentElement.style.setProperty('--oe-height', height + 'px');
	const rect = frame.getBoundingClientRect();
	const ratio = Math.min(window.devicePixelRatio || 1, 2);
	const width = Math.round(rect.width * ratio);
	const pixels = Math.round(rect.height * ratio);
	if (canvas.width !== width) canvas.width = width;
	if (canvas.height !== pixels) canvas.height = pixels;
}
window.orcsElvesSafeInset = function (edge) {
	const value = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--oe-safe-' + edge)) || 0;
	const rect = frame.getBoundingClientRect();
	const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
	const gaps = {left: rect.left, right: window.innerWidth - rect.right, top: rect.top, bottom: height - rect.bottom};
	return Math.max(0, value - gaps[edge]);
};
sizePortraitFrame();
window.addEventListener('resize', sizePortraitFrame);
if (window.visualViewport) window.visualViewport.addEventListener('resize', sizePortraitFrame);
const engine = new Engine({...GODOT_CONFIG, onProgress: function (current, total) {
	const progress = document.getElementById('status-progress');
	if (current > 0 && total > 0) {
		progress.value = current; progress.max = total;
	} else {
		progress.removeAttribute('value'); progress.removeAttribute('max');
	}
}});

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		const pack = GODOT_CONFIG.executable + '.pck';
		// Keep the runtime filename stable while fetching this exported revision.
		const revision = 'orcs-elves-2-' + Date.now();
		Promise.all([
			engine.init(GODOT_CONFIG.executable),
			engine.preloadFile(pack + '?v=' + revision, pack),
		]).then(() => engine.start({args: ['--main-pack', pack].concat(GODOT_CONFIG.args || [])})).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
